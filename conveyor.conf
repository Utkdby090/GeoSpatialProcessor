// Tells Conveyor to read dependencies and mainClass from Gradle
include "#!./gradlew -q printConveyorConfig"
include required("/stdlib/jdk/17/amazon.conf")

app {
  display-name = "GeoSpatial Tower Processor"
  fsname = "geospatial-processor"
  vendor = "GeoSpatial Tech Solutions"
  description = "Enterprise GeoSpatial Data Processing Tool"

  // Required setting for Conveyor. You can change this later if you host the installer somewhere.
  site.base-url = "localhost:8080"

  // Your icons
  //icons = "src/main/resources/GeoSpatialProcessor.png"
  //windows.icons = "src/main/resources/GeoSpatialProcessor.png"

  // --- 1. THE FIX: Force the inclusion of database & memory modules ---
  // Note: Conveyor's jdeps analysis is usually smart enough to grab these automatically,
  // but if you want to force them to be 100% sure the DB doesn't crash:
  jvm.modules += java.sql
  jvm.modules += java.naming
  jvm.modules += jdk.unsupported
  jvm.modules += java.management
  jvm.modules += java.desktop

  // --- 2. THE DEBUGGER: Opens a terminal window behind the app ---
  // This will give you the live crash logs right on the Windows desktop
  windows.console = true
}
conveyor.compatibility-level = 21
