[versions]
kotlin = "2.4.20"
compose-multiplatform = "1.12.1"
conveyor = "1.12"
# Must read the Kotlin metadata version we compile with (7.10.0 = Kotlin 2.4); the Compose default lags behind.
proguard = "7.10.0"
exposed = "0.50.1"
sqlite-jdbc = "3.45.1.0"
gson = "2.10.1"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
slf4j = "2.0.9"
logback = "1.4.14"
commons-csv = "1.10.0"
openpdf = "1.3.30"
bouncycastle = "1.77"
koin = "4.2.2"
# Matches the androidx.lifecycle version Compose Multiplatform 1.12 already resolves.
lifecycle = "2.11.0"
compose-material3 = "1.9.0"
# Last published version; the artifact is frozen upstream (Material Symbols is the successor).
compose-material-icons = "1.7.3"

[libraries]
# Build logic (buildSrc) only: lets the convention plugin apply the Kotlin JVM plugin.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
# SQLite3MultipleCiphers build: still needed to READ legacy encrypted data in LegacyDatabaseMigrator.
sqlite-jdbc = { module = "io.github.willena:sqlite-jdbc", version.ref = "sqlite-jdbc" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Provides Dispatchers.Main (the Swing event thread) on desktop; viewModelScope runs on it.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }
# Required by OpenPDF for the ProGuard verifier.
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
conveyor = { id = "dev.hydraulic.conveyor", version.ref = "conveyor" }
